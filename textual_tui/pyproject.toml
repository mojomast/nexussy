[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexussy-textual"
version = "0.1.0"
description = "Keyboard-first Textual TUI for nexussy pipeline control"
requires-python = ">=3.11"
dependencies = ["textual>=0.86", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
nexussy-textual = "nexussy_textual.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexussy_textual*"]

[tool.setuptools.package-data]
nexussy_textual = ["*.tcss"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F"]
